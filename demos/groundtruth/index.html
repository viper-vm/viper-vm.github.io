<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Groundtruth — India's megaprojects, watched from orbit</title>
  <meta name="description" content="A satellite time machine for India's megaprojects. Scrub 15 years of sub-metre imagery over airports, sea bridges, ports and solar parks — or scan any spot on Earth — then compare, measure and export timelapses." />
  <meta name="theme-color" content="#07090c" />
  <meta property="og:title" content="Groundtruth — India's megaprojects, watched from orbit" />
  <meta property="og:description" content="Scrub 15 years of satellite imagery over 33 megaprojects, or scan any spot. Swipe, lens, blink, measure, export timelapses." />
  <meta property="og:image" content="https://viper-vm.github.io/demos/groundtruth/card.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ffb547' stroke-width='2.5'/%3E%3Cpath d='M16 7v18' stroke='%235ee0ff' stroke-width='2.5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://wayback.maptiles.arcgis.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-single" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/></symbol>
      <symbol id="i-swipe" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M12 3v18"/><path d="m9.5 10-2 2 2 2M14.5 10l2 2-2 2"/></symbol>
      <symbol id="i-lens" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="12" cy="12" r="4.2"/></symbol>
      <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="6" width="8" height="12" rx="2"/><rect x="13" y="6" width="8" height="12" rx="2"/></symbol>
      <symbol id="i-blink" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-3d" viewBox="0 0 24 24"><path d="m2.5 19 6-10 4 6 3-4 6 8Z"/><circle cx="17" cy="6" r="1.8"/></symbol>
      <symbol id="i-labels" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></symbol>
      <symbol id="i-ruler" viewBox="0 0 24 24"><path d="m3.5 16.5 13-13 4 4-13 13Z"/><path d="m7.5 12.5 2 2M10.5 9.5l2 2M13.5 6.5l2 2"/></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l2.8-2.8a4.5 4.5 0 0 0-6.4-6.4L11.5 6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-2.8 2.8a4.5 4.5 0 0 0 6.4 6.4l1.3-1.2"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6M12 16.8v.2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5.5h2.8v13H8zM13.2 5.5H16v13h-2.8z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.8l-5.1 2.7 1-5.7-4.1-4 5.7-.8Z"/></symbol>
      <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="2.2"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h11l-3.5-3.5M17 17H6l3.5 3.5"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="rail" id="rail" aria-label="Projects and details">
      <header class="rail-head">
        <div class="brand-row">
          <a class="brand" href="./" aria-label="Groundtruth home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">Groundtruth</span>
          </a>
          <button class="icon-btn rail-toggle" id="railToggle" aria-label="Hide panel" title="Hide panel"><svg><use href="#i-back"/></svg></button>
        </div>
        <p class="brand-tag">India's megaprojects, watched from orbit — <span id="brandSpan">every satellite pass since 2010</span>.</p>
        <label class="search" for="q">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="q" type="search" placeholder="Search projects, places, or lat, lng" autocomplete="off" spellcheck="false" />
          <kbd>/</kbd>
        </label>
        <nav class="tabs" role="tablist" aria-label="Sections">
          <button role="tab" data-tab="projects" aria-selected="true">Projects</button>
          <button role="tab" data-tab="explore" aria-selected="false">Explore</button>
          <button role="tab" data-tab="watch" aria-selected="false">Watchlist <span class="badge" id="watchBadge" hidden></span></button>
        </nav>
      </header>
      <div class="rail-body" id="railBody"></div>
    </aside>

    <main class="stage" id="stage" data-mode="single" data-ctx="overview">
      <div id="mapA" class="map map-a"></div>
      <div id="mapB" class="map map-b"></div>
      <div class="swipe" tabindex="0" role="slider" aria-label="Swipe divider — drag or use arrow keys" aria-valuemin="0" aria-valuemax="100"><span class="swipe-knob"><svg><use href="#i-swipe"/></svg></span></div>
      <div class="lens" aria-hidden="true"></div>
      <div class="crosshair" aria-hidden="true"><span></span></div>
      <div class="chip chip-a" id="chipA"></div>
      <div class="chip chip-b" id="chipB"></div>
      <div class="grid-view" id="gridView" hidden></div>

      <div class="topbar">
        <button class="icon-btn show-rail" id="showRail" aria-label="Show panel" title="Show panel"><svg><use href="#i-menu"/></svg></button>
        <div class="modes" role="radiogroup" aria-label="View mode" id="modes">
          <button role="radio" data-mode="single" aria-checked="true" title="Single (1)"><svg><use href="#i-single"/></svg><span>Single</span></button>
          <button role="radio" data-mode="swipe" aria-checked="false" title="Swipe (2)"><svg><use href="#i-swipe"/></svg><span>Swipe</span></button>
          <button role="radio" data-mode="lens" aria-checked="false" title="Lens (3) — Shift+scroll resizes"><svg><use href="#i-lens"/></svg><span>Lens</span></button>
          <button role="radio" data-mode="split" aria-checked="false" title="Split (4)"><svg><use href="#i-split"/></svg><span>Split</span></button>
          <button role="radio" data-mode="blink" aria-checked="false" title="Blink (5)"><svg><use href="#i-blink"/></svg><span>Blink</span></button>
          <button role="radio" data-mode="grid" aria-checked="false" title="Contact sheet (6)"><svg><use href="#i-grid"/></svg><span>Sheet</span></button>
        </div>
        <div class="tools">
          <button class="icon-btn" id="btn3d" aria-pressed="false" title="3D terrain (T)"><svg><use href="#i-3d"/></svg></button>
          <button class="icon-btn" id="btnLabels" aria-pressed="true" title="Place labels (L)"><svg><use href="#i-labels"/></svg></button>
          <button class="icon-btn" id="btnMeasure" aria-pressed="false" title="Measure distance & area (M)"><svg><use href="#i-ruler"/></svg></button>
          <button class="icon-btn" id="btnShare" title="Copy link to this view"><svg><use href="#i-link"/></svg></button>
          <button class="icon-btn" id="btnHelp" title="How it works (?)"><svg><use href="#i-help"/></svg></button>
          <button class="btn btn-accent" id="btnExport" title="Export timelapse, images or contact sheet (E)"><svg><use href="#i-export"/></svg><span>Export</span></button>
        </div>
      </div>

      <div class="float-card measure-card" id="measureCard" hidden>
        <div class="mc-row">
          <div><div class="mc-k">Distance</div><div class="mc-v" id="mcDist">—</div></div>
          <div><div class="mc-k">Area</div><div class="mc-v" id="mcArea">—</div></div>
        </div>
        <div class="mc-hint">Click to add points · Backspace undo · Esc done</div>
        <div class="mc-actions">
          <button class="btn btn-quiet" id="mcUndo">Undo</button>
          <button class="btn btn-quiet" id="mcClear">Clear</button>
          <button class="btn" id="mcDone">Done</button>
        </div>
      </div>

      <button class="float-card leave-pill" id="leavePill" hidden><svg><use href="#i-scan"/></svg><span>Scan this spot instead</span></button>
      <button class="scan-fab" id="scanFab" hidden><svg><use href="#i-scan"/></svg><span>Scan capture history here</span></button>

      <section class="dock" id="dock" aria-label="Timeline">
        <div class="dock-head">
          <div class="readout" id="readout"></div>
          <div class="dock-ctrls">
            <div class="seg src-toggle" id="srcToggle" role="radiogroup" aria-label="Imagery source">
              <button role="radio" data-src="hires" aria-checked="true" title="Sub-metre commercial imagery (Esri Wayback archive)">Hi-res</button>
              <button role="radio" data-src="s2" aria-checked="false" title="Sentinel-2 yearly cloud-free mosaics, 10 m (EOX)">Sentinel-2</button>
            </div>
            <div class="transport">
              <button class="icon-btn" id="btnPrev" title="Previous capture (←)" aria-label="Previous capture"><svg><use href="#i-prev"/></svg></button>
              <button class="icon-btn play" id="btnPlay" title="Play timelapse (Space)" aria-label="Play"><svg><use href="#i-play"/></svg></button>
              <button class="icon-btn" id="btnNext" title="Next capture (→)" aria-label="Next capture"><svg><use href="#i-next"/></svg></button>
            </div>
          </div>
        </div>
        <div class="tl" id="tl"></div>
        <div class="dock-empty" id="dockEmpty"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="icon-btn modal-x" data-close aria-label="Close"><svg><use href="#i-close"/></svg></button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
